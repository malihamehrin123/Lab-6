<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact-Wonder the World</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar md:navbar-expand bg-1 fg-2">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Wonder the World</a>

                <button class="btn-icon navbar-toggler" type="button"
                     data-bs-toggle="drawer"
                     data-bs-target="#navbarNav"
                     aria-controls="navbarNav"
                     aria-expanded="false"
                     aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                    </button>

                <dialog class="drawer drawer-end" tabindex="-1"
                    id="navbarNav" aria-labelledby="navbarNavlabel">
                
                    <div class="drawer-header">
                        <h5 class="drawer-title" id="navbarNavlabel">Menu</h5>
                        <button type="button" class="btn-close"
                            data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>

                    <div class="drawer-body">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link" href="index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="index.html#destinations">Destinations</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
                            </li>
                        </ul>
                    </div>
                </dialog>
            </div>
        </nav>
    </header>

    <main>
        <div class="container mt-5">
            <h1>Contact Us</h1>
            <p>Have questions about yout next vacation? Contact us!</p>

            <form>
                <div class="row g-4">
                    <div class="col-12 md:col-6">
                        <div class="form-field">
                            <label for="firstName">First Name</label>
                            <input type="text" class="form-control"
                               id="firstName" name="firstName" required>
                        </div>
                    </div>

                    <div class="col-12 md:col-6">
                        <div class="form-field">
                            <label for="lastName">Last Name</label>
                            <input type="text" class="form-control"
                                id="lastName" name="lastName" required>
                        </div>
                    </div>
                </div>

                <div class="form-field mt-4">
                    <label for="email">Email Address</label>
                    <input type="email" class="form-control"
                        id="email" name="email"
                        placeholder="Enter your email" required>
                </div>

                <div class="form-field mt-4">
                    <label for="destination">Destinations</label>
                    <select class="form-control" id="destination" name="destination" required>
                        <option value="">Choose a destination</option>
                        <option value="paris">Paris, France</option>
                        <option value="cairo">Cairo, Egypt</option>
                        <option value="seoul">Seoul, South Korea</option>
                        <option value="brussels">Brussels, Belgium</option>
                        <option value="istanbul">Istanbul, Turkey</option>
                        <option value="kuala-lumpur">Kuala Lumpur, Malaysia</option>
                    </select>
                </div>
                <div class="form-field mt-4">
                    <label for="message">Message</label>
                    <textarea class="form-control" id="message"
                         name="message" rows="4" required></textarea>
                </div>

                <div class="form-field mt-4">
                    <input type="checkbox" class="check"
                        id="consent" name="consent" required>
                    <label for="consent">I agree to to be contacted</label>
                </div>

                <button type="submit" class="btn-solid theme-primary mt-4">
                    Send Message
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-1 fg-2 py-4 mt-5">
        <div class="container text-center">
            <p>&copy; 2026 Wonder the World</p>
        </div>
    </footer>

     <script type="module" src="js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
