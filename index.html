<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonder the World</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar md:navbar-expand bg-1 fg-2">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Wonder the World</a>

                <button class="btn-icon navbar-toggler" type="button"
                     data-bs-toggle="drawer"
                     data-bs-target="#navbarNav"
                     aria-controls="navbarNav"
                     aria-expanded="false"
                     aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                    </button>

                <dialog class="drawer drawer-end" tabindex="-1"
                    id="navbarNav" aria-labelledby="navbarNavlabel">
                
                    <div class="drawer-header">
                        <h5 class="drawer-title" id="navbarNavlabel">Menu</h5>
                        <button type="button" class="btn-close"
                            data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>

                    <div class="drawer-body">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#destinations">Destinations</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="contact.html">Contact</a>
                            </li>
                        </ul>
                    </div>
                </dialog>
            </div>
        </nav>
    </header>
    <main>
        <div class="container mt-3">

        <div id="heroCarousel" class="carousel carousel-overlay slide">

            <div class="carousel-inner rounded-5">

                <div class="carousel-item active">
                    <img src="images/Paris.jpg" class="d-block w-100 object-fit-cover" height="350" alt="Eiffel Tower in Paris">
                </div>

                <div class="carousel-item">
                    <img src="images/Cairo.jpg" class="d-block w-100 object-fit-cover" height="350" alt="Pyramids of Giza at Sunset">
                </div>

                <div class="carousel-item">
                    <img src="images/Seoul.jpg" class="d-block w-100 object-fit-cover" height="350" alt="Seoul city skyline">
                </div>

            </div>

            <div class="carousel-overlay-controls">

                <div>
                    <button class="btn-icon btn-sm btn-subtle theme-secondary" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
                        <span class="carousel-icon-prev" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>

                    <button class="btn-icon btn-sm btn-subtle theme-secondary" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
                        <span class="carousel-icon-next" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>

                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Paris slide"></button>
                    <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1" aria-label="Cairo slide"></button>
                    <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2" aria-label="Seoul slide"></button>
                </div>
            </div>
        
        </div>
        </div>
        
    </main>
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
